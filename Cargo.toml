[package]
name = "recorder"
version = "0.4.1"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = "0.4"
cpal = "0.15"
eframe = "0.29"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.windows-sys]
version = "0.52"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
strip = true
